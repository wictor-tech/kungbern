name: LUP Hjälp

on:
  push:
    paths: ["help/**", ".github/workflows/help.yml"]
  pull_request:
    paths: ["help/**", ".github/workflows/help.yml"]

defaults:
  run:
    working-directory: help

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: help/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Sökningens träffsäkerhet
        run: npx tsx scripts/eval-search.ts --strict
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
