<title>LUPNUMBER – Pärmar och papperslogg</title>
<style>/* LUPNUMBER – LÅSTA varumärkestokens. Ändra inte per klipp. */

:root {
  --bg: #F5FAFE;
  --card: #FFFFFF;
  --border: #BAE6FD;
  --accent: #0EA5E9;
  --heading: #0C4A6E;
  --text: #334155;
  --muted: #64748B;
  --tint-1: #E0F2FE;
  --tint-2: #F0F9FF;
  --tint-3: #ECFDF5;
  --font: "Inter", "Inter Display", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  --radius: 28px;
  --radius-sm: 18px;
  --shadow: 0 18px 40px rgba(14, 165, 233, 0.10), 0 2px 6px rgba(12, 74, 110, 0.06);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #0b1220; font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; }

/* ---- Stage ---- */
.stage {
  position: relative;
  width: 1080px; height: 1350px;
  background: var(--bg);
  overflow: hidden;
  font-family: var(--font);
  color: var(--text);
}
.stage * { will-change: transform, opacity; }

.blob { position: absolute; border-radius: 50%; filter: blur(2px); pointer-events: none; }
.blob-1 { width: 820px; height: 820px; left: -300px; top: -260px; background: radial-gradient(circle, var(--tint-1) 0%, rgba(224,242,254,0) 70%); }
.blob-2 { width: 760px; height: 760px; right: -300px; bottom: -220px; background: radial-gradient(circle, var(--tint-3) 0%, rgba(236,253,245,0) 70%); }
.blob-3 { width: 520px; height: 520px; right: -120px; top: 180px; background: radial-gradient(circle, var(--tint-2) 0%, rgba(240,249,255,0) 70%); }

.phase { position: absolute; inset: 0; opacity: 0; visibility: hidden; }

/* ---- Wordmark ---- */
.wordmark { display: inline-flex; align-items: baseline; font-weight: 800; letter-spacing: -0.04em; line-height: 1; white-space: nowrap; }
.wordmark .wm-lup { color: var(--accent); }
.wordmark .wm-number { color: var(--heading); }
.wordmark i { display: inline-block; font-style: normal; }
.wm-bar { height: 10px; border-radius: 999px; background: var(--accent); transform-origin: left center; }
.tagline { color: var(--muted); font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }

/* ---- Episode badge (top). Wordmarken morfar hit från intron, sep + ep positioneras i shell.js ---- */
.badge { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 18px; }
.badge .sep { width: 2px; height: 26px; background: var(--border); border-radius: 2px; }
.badge .ep { color: var(--muted); font-weight: 700; font-size: 20px; letter-spacing: 0.16em; }
.wm-layer { position: absolute; left: 0; top: 0; transform-origin: top left; }

/* ---- Typography ---- */
.hook-text { color: var(--heading); font-weight: 800; font-size: 96px; line-height: 1.04; letter-spacing: -0.035em; text-align: center; }
.hook-text .w { display: inline-block; }
.hook-sub { color: var(--muted); font-weight: 600; font-size: 34px; text-align: center; margin-top: 28px; }
.h1 { color: var(--heading); font-weight: 800; font-size: 58px; line-height: 1.08; letter-spacing: -0.03em; }
.lead { color: var(--text); font-weight: 500; font-size: 30px; line-height: 1.35; }
.kicker { color: var(--heading); font-weight: 800; font-size: 54px; letter-spacing: -0.03em; line-height: 1.1; }
.kicker em { font-style: normal; color: var(--accent); }

/* ---- Icon circle ---- */
.icon-circle { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--card); border: 3px solid var(--border); color: var(--accent); box-shadow: var(--shadow); }
.icon-circle svg { width: 52%; height: 52%; }

/* ---- Cards ---- */
.card { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.chip { display: inline-flex; align-items: center; gap: 16px; background: var(--card); border: 2px solid var(--border); border-radius: 999px; padding: 18px 30px 18px 20px; color: var(--text); font-weight: 600; font-size: 29px; white-space: nowrap; }
.chip .dot { width: 44px; height: 44px; border-radius: 50%; background: var(--tint-1); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; flex: 0 0 auto; }
.chip .dot svg { width: 24px; height: 24px; }

/* ---- Flow: numrerade accent-cirklar + linje + kort ---- */
.flow { position: relative; display: flex; gap: 24px; align-items: stretch; }
.flow-line { position: absolute; left: 148px; right: 148px; top: 0; height: 6px; border-radius: 999px; background: var(--accent); transform-origin: left center; }
.flow-line.ghost { background: var(--border); }
.step { position: relative; flex: 1 1 0; padding: 68px 24px 34px; text-align: center; }
.step .num { position: absolute; left: 50%; top: 0; width: 64px; height: 64px; margin-left: -32px; margin-top: -32px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; font-size: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(14,165,233,0.35); }
.step .ico { color: var(--accent); height: 72px; display: flex; align-items: center; justify-content: center; }
.step .ico svg { width: 64px; height: 64px; }
.step .label { color: var(--heading); font-weight: 800; font-size: 32px; letter-spacing: -0.02em; margin-top: 10px; line-height: 1.1; }
.step .sub { color: var(--muted); font-weight: 600; font-size: 22px; margin-top: 8px; }

/* ---- CTA ---- */
.cta-pill { display: inline-flex; align-items: center; gap: 18px; background: var(--accent); color: #fff; font-weight: 800; font-size: 40px; padding: 28px 56px; border-radius: 999px; box-shadow: 0 22px 44px rgba(14,165,233,0.35); }
.cta-pill svg { width: 40px; height: 40px; }
.url { color: var(--heading); font-weight: 700; font-size: 36px; letter-spacing: -0.01em; }
.company { color: var(--muted); font-weight: 600; font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; }

/* ---- Hero (scenvisuals) ---- */
.hero { position: absolute; left: 72px; right: 72px; }

.hero-muted { color: var(--muted); }

.captions { position: absolute; left: 72px; right: 72px; top: 1196px; display: flex; justify-content: center; pointer-events: none; }

body.render .controls { display: none; }
body.render .viewport { transform: none !important; }

<script>/* LUPNUMBER shorts – animationsmotor. Allt styrs av tiden t (sekunder), inget beror på klockan. */
(function () {
  const LUP = (window.LUP = window.LUP || {});
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const easeIn = (p) => p * p * p;
  const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const back = (p) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  // 0..1 mellan start och start+dur, valfri easing
  const prog = (t, start, dur, ease) => { const p = clamp((t - start) / dur, 0, 1); return ease ? ease(p) : p; };
  // in/ut-kurva: tonar in över inDur, håller, tonar ut över outDur innan end
  const window_ = (t, start, end, inDur, outDur) => {
    if (t < start || t > end) return 0;
    const a = prog(t, start, inDur, easeOut);
    const b = 1 - prog(t, end - outDur, outDur, easeIn);
    return Math.min(a, b);
  };

  // Färgblandning mellan två hexfärger, p = 0..1 (används för problem→lösning-toning)
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, p) => { const A = hex(a), B = hex(b), q = clamp(p, 0, 1); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], q))).join(',')})`; };
  const stagger = (t, start, i, step, dur, ease) => prog(t, start + i * step, dur, ease);

  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };
  const css = (e, obj) => { for (const k in obj) e.style[k] = obj[k]; return e; };

  // Standardentré: fade + slide upp (+ liten skala). p = 0..1
  const enter = (e, p, opts = {}) => {
    const dy = opts.dy ?? 28, s0 = opts.scale ?? 1, dx = opts.dx ?? 0;
    e.style.opacity = clamp(p, 0, 1);
    e.style.transform = `translate(${(1 - p) * dx}px, ${(1 - p) * dy}px) scale(${lerp(s0, 1, p)})`;
  };
  const hide = (e) => { e.style.opacity = 0; };

  // Splittar text i rader (\n) och ord, returnerar array av ord-spans
  const words = (container, text, cls = 'w') => {
    container.innerHTML = '';
    const out = [];
    text.split('\n').forEach((line, li) => {
      if (li) container.appendChild(el('br'));
      line.split(/\s+/).filter(Boolean).forEach((w, wi, arr) => {
        const s = el('span', cls, w);
        container.appendChild(s);
        if (wi < arr.length - 1) container.appendChild(document.createTextNode(' '));
        out.push(s);
      });
    });
    return out;
  };

  // Wordmark: LUP (accent) + NUMBER (heading), bokstav för bokstav
  const wordmark = (size, brand) => {
    const w = el('div', 'wordmark');
    w.style.fontSize = size + 'px';
    const a = el('span', 'wm-lup'), b = el('span', 'wm-number');
    [...brand.wordmark.accent].forEach((ch) => a.appendChild(el('i', null, ch)));
    [...brand.wordmark.heading].forEach((ch) => b.appendChild(el('i', null, ch)));
    w.appendChild(a); w.appendChild(b);
    w._letters = [...w.querySelectorAll('i')];
    return w;
  };
  // Bygger upp wordmark: start = när första bokstaven kommer, stagger per bokstav
  const animateWordmark = (w, t, start, stagger = 0.07, dur = 0.5) => {
    w._letters.forEach((L, i) => {
      const p = prog(t, start + i * stagger, dur, back);
      L.style.opacity = clamp(p * 1.5, 0, 1);
      L.style.transform = `translateY(${(1 - p) * 0.35}em) scale(${lerp(0.7, 1, p)})`;
    });
  };

  LUP.util = { clamp, lerp, easeOut, easeIn, easeInOut, back, prog, window: window_, mix, stagger, el, css, enter, hide, words, wordmark, animateWordmark };
})();

/* Ikonbibliotek – stroke-ikoner, 24x24, currentColor. Lägg till här, referera med namn i klipp-JSON. */

    bolt: wrap('<path d="M13 2.5 4.5 13.5H11l-1 8 8.5-11H12z"/>'),
    search: wrap('<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/>'),
    handset: wrap('<path d="M5 3.5h3.5l1.8 4.5-2.3 1.6a11 11 0 0 0 6.4 6.4l1.6-2.3 4.5 1.8V19a2 2 0 0 1-2 2A15.5 15.5 0 0 1 3 5.5a2 2 0 0 1 2-2z"/>'),
    flag: wrap('<path d="M5 21V4"/><path d="M5 4h13l-3 4.5 3 4.5H5"/>'),
    pen: wrap('<path d="m4 20 4-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5 16z"/><path d="m13.5 7.5 3 3"/>'),
    list: wrap('<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1" fill="currentColor"/><circle cx="3.5" cy="12" r="1" fill="currentColor"/><circle cx="3.5" cy="18" r="1" fill="currentColor"/>'),
    shield: wrap('<path d="M12 2.5 4.5 5.5v5.5c0 4.8 3.2 8.4 7.5 10.5 4.3-2.1 7.5-5.7 7.5-10.5V5.5z"/><path d="m9 12 2 2 4-4"/>'),
  };
  LUP.icon = (name) => LUP.icons[name] || LUP.icons.check;

/* Undertexts-cues ur voiceover + tidslinje. Körs både i Node (SRT) och i webbläsaren (inbrända undertexter). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else (root.LUP = root.LUP || {}).captions = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const ORDER = ['intro', 'hook', 'problem', 'solution', 'outro'];
  function phases(brand) {
    const T = brand.timeline; const list = []; let t = 0;
    for (const k of ORDER) { list.push({ key: k, start: t, end: t + T[k] }); t += T[k]; }
    return { list, total: t, byKey: Object.fromEntries(list.map((p) => [p.key, p])) };
  }
  const words = (s) => (String(s).trim().match(/\S+/g) || []);
  // Dela text i cues: först per mening, sedan i jämna bitar om max maxWords ord.
  function splitCue(text, maxWords) {
    const sentences = String(text).replace(/\s+/g, ' ').trim().match(/[^.!?…]+[.!?…]*/g) || [text];
    const out = [];
    for (const s of sentences) {
      const w = words(s); if (!w.length) continue;
      const parts = Math.ceil(w.length / maxWords), per = Math.ceil(w.length / parts);
      for (let i = 0; i < w.length; i += per) out.push(w.slice(i, i + per).join(' '));
    }
    // slå ihop mycket korta cues (≤2 ord) med nästa om det ryms
    const merged = [];
    for (const c of out) {
      const prev = merged[merged.length - 1];
      if (prev && words(prev).length <= 2 && words(prev).length + words(c).length <= maxWords) merged[merged.length - 1] = prev + ' ' + c;
      else merged.push(c);
    }
    return merged;
  }
  function cues(brand, clip) {
    const cfg = Object.assign({ maxWordsPerCue: 7, minCueSeconds: 0.9 }, brand.captions || {});
    const { byKey } = phases(brand);
    const all = [];
    for (const k of ['hook', 'problem', 'solution', 'outro']) {
      const text = clip.voiceover && clip.voiceover[k]; if (!text) continue;
      const ph = byKey[k];
      const parts = splitCue(text, cfg.maxWordsPerCue);
      const total = parts.reduce((a, p) => a + words(p).length, 0);
      const w0 = ph.start + 0.25, w1 = ph.end - 0.15, span = w1 - w0;
      let t = w0;
      parts.forEach((p, i) => {
        let d = Math.max(cfg.minCueSeconds, (words(p).length / total) * span);
        if (i === parts.length - 1) d = w1 - t; // sista cuen fyller ut beaten
        all.push({ beat: k, start: +t.toFixed(3), end: +Math.min(w1, t + d).toFixed(3), text: p });
        t += d;
      });
    }
    return all;
  }
  return { ORDER, phases, splitCue, cues, words };
});

/* Yard-primitiver: färdiga delar att komponera scenvisualer av. Hero-ytan är 936×400 px.
   Alla primitiver returnerar ett Item med .set({x,y,scale,rotate,opacity,color}) och .tone(p) (muted→accent). */
(function () {
  const LUP = (window.LUP = window.LUP || {});
  const U = LUP.util;
  const C = { muted: '#64748B', accent: '#0EA5E9', heading: '#0C4A6E', border: '#BAE6FD', tint: '#E0F2FE', tint2: '#F0F9FF', tint3: '#ECFDF5', card: '#FFFFFF', text: '#334155', bg: '#F5FAFE' };
  const FONT = 'Inter, system-ui, sans-serif';
  const add = (parent, str) => { parent.insertAdjacentHTML('beforeend', str); return parent.lastElementChild; };
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const tone = (p) => U.mix(C.muted, C.accent, p);
  const toneBg = (p) => U.mix(C.card, C.tint, p);
  const fo = (inner, w, h, x = -w / 2, y = -h / 2) => `<foreignObject x="${x}" y="${y}" width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;height:${h}px;display:flex;align-items:center;justify-content:center;color:inherit">${inner}</div></foreignObject>`;

  class Item {
    constructor(el, o = {}) { this.el = el; this.s = Object.assign({ x: 0, y: 0, scale: 1, rotate: 0, opacity: 1, color: null }, o); this.apply(); }
    set(o) { Object.assign(this.s, o); this.apply(); return this; }
    apply() { const s = this.s; this.el.setAttribute('transform', `translate(${s.x} ${s.y}) rotate(${s.rotate}) scale(${s.scale})`); this.el.style.opacity = U.clamp(s.opacity, 0, 1); if (s.color) this.el.style.color = s.color; }
    tone(p) { return this.set({ color: tone(p) }); }
    // "poppar" in med back-easing från start; returnerar progress
    pop(t, start, dur = 0.5) { const p = U.prog(t, start, dur, U.back); this.set({ scale: Math.max(0.001, p) * (this.base || 1), opacity: U.clamp(p * 2, 0, 1) }); return p; }

        <rect x="99" y="24" width="12" height="11" rx="2" fill="currentColor" opacity=".35"/>
        <circle cx="24" cy="54" r="9" fill="#fff" stroke="currentColor" stroke-width="4"/>

        <g class="arm" transform-origin="11 24">

    dock(svg, { w = 110, h = 64, text = '', ...o }) {

    path(svg, { d, width = 10, dash = null, ...o }) {

    phone(svg, { w = 150, h = 270, ...o } = {}) {

        <rect x="${w / 2 - 22}" y="12" width="44" height="6" rx="3" fill="currentColor" opacity=".5"/>

    sheet(svg, { w = 200, h = 250, lines = 6, title = true, ...o } = {}) {

    dot(svg, { r = 8, ...o } = {}) {

    row(svg, { w, cols, h = 50, bg = 'transparent', fg = C.text, ...o }) {

/* LUPNUMBER shorts – LÅST MALL.
   Intro (wordmark byggs upp och morfar in i badgen) → Hook → Problem → Lösning → Outro.
   Problem och lösning delar EN hero-visual ("samma kamera") som tonar från grått till sky.

(function () {
  const LUP = (window.LUP = window.LUP || {});

    const total = acc;
    const IN = 0.4, OUT = 0.3; // fasövergång (sek)

    const P = { hook: layer('hook'), problem: layer('problem'), solution: layer('solution'), outro: layer('outro') };

    if (opts.captions && LUP.captions) {
      cueList = LUP.captions.cues(brand, clip);
      cueBox = U.el('div', 'captions'); cueEl = U.el('div', 'cue', '');
      cueBox.appendChild(cueEl); stage.appendChild(cueBox);
    }

    // ---- Per-frame ----
    // Faserna överlappar med LAP sekunder så att nästa fas börjar tona in innan den förra är helt borta (inget tomt hål).
    const LAP = 0.2;
    const setPhase = (ph, name, t) => {
      const s = starts[name] - (name === 'intro' ? 0 : LAP), e = starts[name] + T[name];
      const v = U.window(t, s, e, IN, OUT);
      const vis = t >= s && t < e + 0.001;
      ph.style.visibility = vis ? 'visible' : 'hidden';
      ph.style.opacity = vis ? v : 0;
      ph.style.transform = `translateY(${(1 - U.prog(t, s, IN, U.easeOut)) * 30}px)`;
      return vis ? t - starts[name] : null; // l kan vara svagt negativt under överlappet; prog() klampar till 0
    };

    function seek(frame) {
      LUP._lastFrame = frame;
      const t = frame / fps;
      blobs[0].style.transform = `translate(${Math.sin(t * 0.25) * 30}px, ${Math.cos(t * 0.2) * 24}px)`;
      blobs[1].style.transform = `translate(${Math.cos(t * 0.22) * -28}px, ${Math.sin(t * 0.18) * -20}px)`;
      blobs[2].style.transform = `translate(${Math.sin(t * 0.3) * 18}px, ${Math.cos(t * 0.26) * 16}px)`;

      // Wordmark: byggs upp, morfar till badge-position, tonar ut vid outro
      U.animateWordmark(wm, t, 0.15, 0.06, 0.5);
      const m = U.prog(t, T.intro - 0.55, 0.7, U.easeInOut);
      const sc = U.lerp(1, geo.scale, m);
      wmLayer.style.transform = `translate(${U.lerp(geo.x0, BADGE.left, m)}px, ${U.lerp(geo.y0, BADGE.top, m)}px) scale(${sc})`;
      wmLayer.style.opacity = 1 - U.prog(t, starts.outro - 0.3, 0.3);
      // Badge-sep + avsnitt: in när morfen landat
      const bp = U.prog(t, T.intro + 0.05, 0.4, U.easeOut);
      badge.style.opacity = Math.min(bp, 1 - U.prog(t, starts.outro - 0.3, 0.3));
      badge.style.transform = `translateX(${(1 - bp) * -16}px)`;

      // INTRO (bar + tagline)
      let l = setPhase(introLayer, 'intro', t);
      if (l !== null) {
        const barP = U.prog(l, 0.8, 0.45, U.easeInOut);
        introBar.style.transform = `scaleX(${barP})`;
        const outP = U.prog(l, T.intro - 0.6, 0.3, U.easeIn);
        introBar.style.opacity = (barP > 0 ? 1 : 0) * (1 - outP);
        U.enter(introTag, U.prog(l, 0.95, 0.45, U.easeOut), { dy: 14 });
        introTag.style.opacity = U.prog(l, 0.95, 0.45) * (1 - outP);
      }

      // HOOK
      l = setPhase(P.hook, 'hook', t);
      if (l !== null) {
        U.enter(hookIcon, U.prog(l, 0.1, 0.6, U.back), { dy: 0, scale: 0.4 });
        hookWords.forEach((w, i) => U.enter(w, U.prog(l, 0.3 + i * 0.09, 0.5, U.easeOut), { dy: 40 }));
        U.enter(hookSub, U.prog(l, 0.3 + hookWords.length * 0.09 + 0.25, 0.5, U.easeOut), { dy: 18 });
      }

      // HERO (problem + lösning, samma kamera)
      if (hasHero) {
        const hs = starts.problem - LAP, he = starts.solution + T.solution;
        const vis = t >= hs && t < he;
        hero.style.visibility = vis ? 'visible' : 'hidden';
        hero.style.opacity = U.window(t, hs, he, IN, OUT);
        hero.style.transform = `translateY(${(1 - U.prog(t, hs, IN, U.easeOut)) * 30}px)`;
        if (vis) {
          const inSol = t >= starts.solution;
          heroSeek({
            t: t - starts.problem,                       // sek sedan problemfasen började (svagt negativt under intoningen)
            phase: inSol ? 'solution' : 'problem',
            l: inSol ? t - starts.solution : t - starts.problem, // sek in i aktuell fas
            p: U.prog(t, starts.solution - 0.1, 0.9, U.easeInOut), // 0 = problem (grått), 1 = lösning (sky)
            P: T.problem, S: T.solution,
          });
        }
      }

      // PROBLEM
      l = setPhase(P.problem, 'problem', t);
      if (l !== null) {
        probTitleWords.forEach((w, i) => U.enter(w, U.prog(l, 0.1 + i * 0.06, 0.45, U.easeOut), { dy: 24 }));
        const chipStart = hasHero ? 1.5 : 0.8;
        chipEls.forEach((c, i) => U.enter(c, U.prog(l, chipStart + i * 0.35, 0.5, U.back), { dy: 0, dx: -40, scale: 0.9 }));
      }

      // LÖSNING
      l = setPhase(P.solution, 'solution', t);
      if (l !== null) {
        solTitleWords.forEach((w, i) => U.enter(w, U.prog(l, 0.1 + i * 0.06, 0.45, U.easeOut), { dy: 24 }));
        const f0 = hasHero ? 1.2 : 0.6;
        flowGhost.style.opacity = U.prog(l, f0, 0.3);
        flowLine.style.transform = `scaleX(${U.prog(l, f0 + 0.2, 1.2, U.easeInOut)})`;
        stepEls.forEach((s, i) => U.enter(s, U.prog(l, f0 + 0.25 + i * 0.45, 0.6, U.back), { dy: 36, scale: 0.92 }));
        U.enter(kicker, U.prog(l, f0 + 1.9, 0.6, U.easeOut), { dy: 22 });
      }

      // OUTRO
      l = setPhase(P.outro, 'outro', t);
      if (l !== null) {
        U.animateWordmark(outWm, l, 0.1, 0.045, 0.5);
        U.enter(outTag, U.prog(l, 0.6, 0.45, U.easeOut), { dy: 14 });
        U.enter(outCta, U.prog(l, 0.95, 0.6, U.back), { dy: 0, scale: 0.7 });
        U.enter(outUrl, U.prog(l, 1.3, 0.45, U.easeOut), { dy: 14 });
        U.enter(outCo, U.prog(l, 1.6, 0.5, U.easeOut), { dy: 10 });
      }

      // UNDERTEXTER
      if (cueList) {
        const c = cueList.find((q) => t >= q.start && t < q.end);
        if (c) { if (cueEl.textContent !== c.text) cueEl.textContent = c.text; cueBox.style.opacity = Math.min(U.prog(t, c.start, 0.15), 1 - U.prog(t, c.end - 0.15, 0.15)); }
        else cueBox.style.opacity = 0;
      }
    }

    LUP.timeline = { starts, durations: T, total, fps, frames: Math.round(total * fps) };
    window.__seek = seek;
    window.__setRenderMode = () => document.body.classList.add('render');
    seek(0);
    return LUP.timeline;
  };
})();
</script>
<script>/* Scen: Pärmar och papperslogg → digital logg, sök på sekunder.
   Samma kamera: ett stort kort. Problem = pappershögar, pärm och frågetecken. Lösning = loggtabell, sökning, träff. */
(function () {
  const LUP = (window.LUP = window.LUP || {});
  const U = LUP.util, Y = LUP.yard;
  LUP.scenes = LUP.scenes || {};

  LUP.scenes['papper'] = {
    mount(root) {
      const svg = Y.svg(root);

      const binder = Y.icon(svg, { name: 'clipboard', x: 640, y: 120, size: 84 });
      const mag = Y.icon(svg, { name: 'search', x: 560, y: 250, size: 64 });

      const status = Y.pill(svg, { x: 330, y: 332, text: 'Tisdag 14:10 – vem var det?', icon: 'clock' });
      const cols = [{ x: 24, text: 'Tid' }, { x: 120, text: 'Reg' }, { x: 260, text: 'Bolag' }, { x: 470, text: 'Port' }];
      const header = Y.row(svg, { x: 150, y: 22, w: 636, h: 40, cols: cols.map((c) => ({ ...c, weight: 700, fill: Y.C.muted })) });
      const data = [['13:40', 'ABC 123', 'Nordfrakt', 'Port 1'], ['13:55', 'KLM 456', 'Transit AB', 'Port 3'], ['14:10', 'XYZ 789', 'Frakt & Co', 'Port 2'], ['14:25', 'DEF 321', 'Nordfrakt', 'Port 1'], ['14:40', 'GHI 654', 'Linjetrafik', 'Port 4']];
      const rows = data.map((d, i) => Y.row(svg, { x: 150, y: 70 + i * 52, w: 636, h: 46, cols: cols.map((c, j) => ({ x: c.x, text: d[j], weight: j === 1 ? 700 : 600, fill: j === 1 ? Y.C.heading : Y.C.text })) }));
      const hit = Y.check(svg, { x: 760, y: 70 + 2 * 52 + 23, r: 14 });
      const search = Y.pill(svg, { x: 540, y: 332, text: 'XYZ 789', icon: 'search', fontSize: 24, h: 48 });
      const cloud = Y.icon(svg, { name: 'cloud', x: 770, y: 346, size: 44, color: Y.C.accent });
      return (s) => {
        const { t, p, l } = s;
        desk.style({ border: U.mix(Y.C.border, Y.C.tint, p) });
        sheets.forEach((sh, i) => { sh.pop(t, 0.3 + i * 0.2); sh.set({ opacity: Math.min(sh.s.opacity, 1 - p), rotate: [-7, 4, -1][i] + Math.sin(t * 2 + i) * 1.5 }); });
        binder.pop(t, 0.8); binder.set({ opacity: Math.min(binder.s.opacity, 1 - p) });
        mag.pop(t, 1.3); mag.set({ opacity: Math.min(mag.s.opacity, 1 - p), x: 560 + Math.sin(t * 2.5) * 10, y: 250 + Math.cos(t * 2.5) * 8 });
        q.pop(t, 1.7); q.set({ opacity: Math.min(q.s.opacity, 1 - p), y: 240 + Math.sin(t * 3) * 5 });
        status.fadeIn(t, 1.0); status.set({ opacity: Math.min(status.s.opacity, 1 - p) });
        header.set({ opacity: p });
        rows.forEach((r, i) => { const rp = s.phase === 'solution' ? U.prog(l, 0.3 + i * 0.16, 0.4, U.easeOut) : 0; r.set({ opacity: rp, x: 150 + (1 - rp) * 20 }); r.bg(i === 2 ? U.mix('#FFFFFF', Y.C.tint, s.phase === 'solution' ? U.prog(l, 2.2, 0.4) : 0) : 'transparent'); });
        const hp = s.phase === 'solution' ? U.prog(l, 2.4, 0.4, U.back) : 0;
        hit.set({ scale: Math.max(0.001, hp), opacity: hp });
        const sp = s.phase === 'solution' ? U.prog(l, 1.6, 0.4, U.easeOut) : 0;
        search.set({ opacity: sp, y: 332 + (1 - sp) * 10 }).toneStyle(1);
        const cp = s.phase === 'solution' ? U.prog(l, 2.8, 0.5, U.back) : 0;
        cloud.set({ scale: Math.max(0.001, cp), opacity: cp });
      };
    },
  };
})();
</script>
