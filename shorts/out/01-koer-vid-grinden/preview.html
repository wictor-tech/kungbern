<html lang="sv"><head><meta charset="utf-8">
<title>LUPNUMBER – Köer och väntetid vid grinden</title>
<style>/* LUPNUMBER – LÅSTA varumärkestokens. Ändra inte per klipp. */
/* Inter levereras med repot (OFL) så att alla klipp renderas med exakt samma typsnitt. file:///home/user/kungbern/shorts/brand/fonts byts ut av build. */
@font-face { font-family: "Inter"; font-weight: 500; font-style: normal; src: url("file:///home/user/kungbern/shorts/brand/fonts/Inter-Medium.otf") format("opentype"), local("Inter Medium"), local("Inter"); }
@font-face { font-family: "Inter"; font-weight: 600; font-style: normal; src: url("file:///home/user/kungbern/shorts/brand/fonts/Inter-SemiBold.otf") format("opentype"), local("Inter SemiBold"), local("Inter"); }
@font-face { font-family: "Inter"; font-weight: 700; font-style: normal; src: url("file:///home/user/kungbern/shorts/brand/fonts/Inter-Bold.otf") format("opentype"), local("Inter Bold"), local("Inter"); }
@font-face { font-family: "Inter"; font-weight: 800; font-style: normal; src: url("file:///home/user/kungbern/shorts/brand/fonts/Inter-ExtraBold.otf") format("opentype"), local("Inter ExtraBold"), local("Inter"); }
:root {
  --bg: #F5FAFE;
  --card: #FFFFFF;
  --border: #BAE6FD;
  --accent: #0EA5E9;
  --heading: #0C4A6E;
  --text: #334155;
  --muted: #64748B;
  --tint-1: #E0F2FE;
  --tint-2: #F0F9FF;
  --tint-3: #ECFDF5;
  --font: "Inter", "Inter Display", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  --radius: 28px;
  --radius-sm: 18px;
  --shadow: 0 18px 40px rgba(14, 165, 233, 0.10), 0 2px 6px rgba(12, 74, 110, 0.06);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #0b1220; font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; }

/* ---- Stage ---- */
.stage {
  position: relative;
  width: 1080px; height: 1350px;
  background: var(--bg);
  overflow: hidden;
  font-family: var(--font);
  color: var(--text);
}
.stage * { will-change: transform, opacity; }

.blob { position: absolute; border-radius: 50%; filter: blur(2px); pointer-events: none; }
.blob-1 { width: 820px; height: 820px; left: -300px; top: -260px; background: radial-gradient(circle, var(--tint-1) 0%, rgba(224,242,254,0) 70%); }
.blob-2 { width: 760px; height: 760px; right: -300px; bottom: -220px; background: radial-gradient(circle, var(--tint-3) 0%, rgba(236,253,245,0) 70%); }
.blob-3 { width: 520px; height: 520px; right: -120px; top: 180px; background: radial-gradient(circle, var(--tint-2) 0%, rgba(240,249,255,0) 70%); }

.phase { position: absolute; inset: 0; opacity: 0; visibility: hidden; }

/* ---- Wordmark ---- */
.wordmark { display: inline-flex; align-items: baseline; font-weight: 800; letter-spacing: -0.04em; line-height: 1; white-space: nowrap; }
.wordmark .wm-lup { color: var(--accent); }
.wordmark .wm-number { color: var(--heading); }
.wordmark i { display: inline-block; font-style: normal; }
.wm-bar { height: 10px; border-radius: 999px; background: var(--accent); transform-origin: left center; }
.tagline { color: var(--muted); font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }

/* ---- Badge (uppe till vänster från frame 0): liten wordmark + serienamn ---- */
.badge { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 18px; }
.badge .wordmark { font-size: 34px; }
.badge .sep { width: 2px; height: 26px; background: var(--border); border-radius: 2px; }
.badge .ep { color: var(--muted); font-weight: 700; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; }

/* ---- Outro: fråga + handling ---- */
.cta-question { color: var(--heading); font-weight: 800; font-size: 60px; line-height: 1.1; letter-spacing: -0.03em; text-align: center; max-width: 900px; }
.cta-question em { font-style: normal; color: var(--accent); }

/* ---- Flödesfilm: två paneler (idag / med LUPNUMBER) ---- */
.panel { position: absolute; left: 56px; width: 968px; border-radius: 32px; background: var(--card); border: 2px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
.panel.today { background: #FBFDFF; }
.panel.lup { border-color: var(--accent); background: linear-gradient(180deg, var(--tint-2) 0%, #FFFFFF 70%); }
.panel .tag { position: absolute; left: 24px; top: 20px; display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 8px 18px; font-weight: 800; font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; }
.panel.today .tag { background: var(--tint-1); color: var(--muted); }
.panel.lup .tag { background: var(--accent); color: #fff; }
.panel .line { position: absolute; left: 32px; right: 32px; bottom: 22px; text-align: center; font-weight: 700; font-size: 30px; line-height: 1.2; letter-spacing: -0.01em; }
.panel.today .line { color: var(--muted); }
.panel.lup .line { color: var(--heading); }
.panel .hero-slot { position: absolute; left: 50%; top: 66px; width: 936px; height: 400px; transform-origin: top center; }
.stepper { position: absolute; left: 72px; right: 72px; display: flex; align-items: center; }
.stepper .track { position: absolute; left: 20px; right: 20px; top: 19px; height: 4px; border-radius: 2px; background: var(--border); }
.stepper .fill { position: absolute; left: 20px; top: 19px; height: 4px; border-radius: 2px; background: var(--accent); transform-origin: left center; }
.stepper .dot { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--border); background: #fff; color: var(--muted); font-weight: 800; font-size: 19px; display: flex; align-items: center; justify-content: center; }
.stepper .dot.done { background: var(--accent); border-color: var(--accent); color: #fff; }
.stepper .dot.now { background: #fff; border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 6px var(--tint-1); }
.step-label { position: absolute; left: 72px; right: 72px; text-align: center; color: var(--heading); font-weight: 800; font-size: 36px; line-height: 1.1; letter-spacing: -0.02em; }


/* ---- Typography ---- */
.hook-text { color: var(--heading); font-weight: 800; font-size: 96px; line-height: 1.04; letter-spacing: -0.035em; text-align: center; }
.hook-text .w { display: inline-block; }
.hook-sub { color: var(--muted); font-weight: 600; font-size: 34px; text-align: center; margin-top: 28px; }
.h1 { color: var(--heading); font-weight: 800; font-size: 58px; line-height: 1.08; letter-spacing: -0.03em; }
.lead { color: var(--text); font-weight: 500; font-size: 30px; line-height: 1.35; }
.kicker { color: var(--heading); font-weight: 800; font-size: 54px; letter-spacing: -0.03em; line-height: 1.1; }
.kicker em { font-style: normal; color: var(--accent); }

/* ---- Icon circle ---- */
.icon-circle { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--card); border: 3px solid var(--border); color: var(--accent); box-shadow: var(--shadow); }
.icon-circle svg { width: 52%; height: 52%; }

/* ---- Cards ---- */
.card { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.chip { display: inline-flex; align-items: center; gap: 16px; background: var(--card); border: 2px solid var(--border); border-radius: 999px; padding: 18px 30px 18px 20px; color: var(--text); font-weight: 600; font-size: 29px; white-space: nowrap; }
.chip .dot { width: 44px; height: 44px; border-radius: 50%; background: var(--tint-1); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; flex: 0 0 auto; }
.chip .dot svg { width: 24px; height: 24px; }

/* ---- Flow: numrerade accent-cirklar + linje + kort ---- */
.flow { position: relative; display: flex; gap: 24px; align-items: stretch; }
.flow-line { position: absolute; left: 148px; right: 148px; top: 0; height: 6px; border-radius: 999px; background: var(--accent); transform-origin: left center; }
.flow-line.ghost { background: var(--border); }
.step { position: relative; flex: 1 1 0; padding: 68px 24px 34px; text-align: center; }
.step .num { position: absolute; left: 50%; top: 0; width: 64px; height: 64px; margin-left: -32px; margin-top: -32px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; font-size: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(14,165,233,0.35); }
.step .ico { color: var(--accent); height: 72px; display: flex; align-items: center; justify-content: center; }
.step .ico svg { width: 64px; height: 64px; }
.step .label { color: var(--heading); font-weight: 800; font-size: 32px; letter-spacing: -0.02em; margin-top: 10px; line-height: 1.1; }
.step .sub { color: var(--muted); font-weight: 600; font-size: 22px; margin-top: 8px; }

/* ---- CTA ---- */
.cta-pill { display: inline-flex; align-items: center; gap: 18px; background: var(--accent); color: #fff; font-weight: 800; font-size: 40px; padding: 28px 56px; border-radius: 999px; box-shadow: 0 22px 44px rgba(14,165,233,0.35); }
.cta-pill svg { width: 40px; height: 40px; }
.url { color: var(--heading); font-weight: 700; font-size: 36px; letter-spacing: -0.01em; }
.company { color: var(--muted); font-weight: 600; font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; }

/* ---- Hero (scenvisuals) ---- */
.hero { position: absolute; left: 72px; right: 72px; }
.hero svg { overflow: visible; }
.hero-road { fill: var(--border); }
.hero-dash { stroke: #fff; stroke-width: 4; stroke-dasharray: 26 22; }
.hero-muted { color: var(--muted); }
.hero-accent { color: var(--accent); }

/* ---- Inbrända undertexter (valfritt, --captions) ---- */
.captions { position: absolute; left: 72px; right: 72px; top: 1196px; z-index: 5; display: flex; justify-content: center; pointer-events: none; }
.captions .cue { background: rgba(255,255,255,0.92); border: 2px solid var(--border); border-radius: 20px; padding: 14px 28px; color: var(--heading); font-weight: 700; font-size: 31px; line-height: 1.25; text-align: center; max-width: 936px; box-shadow: var(--shadow); }

/* ---- Preview-kontroller (döljs vid rendering) ---- */
.controls { font: 14px/1.4 var(--font); color: #cbd5e1; display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
.controls input[type=range] { flex: 1; }
.controls button { background: #0EA5E9; color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; font-weight: 700; cursor: pointer; }
body.render .controls { display: none; }
body.render .viewport { transform: none !important; }

.viewport{transform-origin:top left;position:absolute;left:0;top:0}
</style></head>

<div class="viewport"><div class="stage"></div></div>
<div class="controls" style="position:fixed;left:0;right:0;bottom:0;background:#0b1220">
  <button id="play">Spela</button>
  <input id="scrub" type="range" min="0" max="0" value="0" step="1">
  <span id="time">0.00 s · frame 0</span>
</div>
<script>/* LUPNUMBER shorts – animationsmotor. Allt styrs av tiden t (sekunder), inget beror på klockan. */
(function () {
  const LUP = (window.LUP = window.LUP || {});
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const easeIn = (p) => p * p * p;
  const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const back = (p) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  // 0..1 mellan start och start+dur, valfri easing
  const prog = (t, start, dur, ease) => { const p = clamp((t - start) / dur, 0, 1); return ease ? ease(p) : p; };
  // in/ut-kurva: tonar in över inDur, håller, tonar ut över outDur innan end
  const window_ = (t, start, end, inDur, outDur) => {
    if (t < start || t > end) return 0;
    const a = prog(t, start, inDur, easeOut);
    const b = 1 - prog(t, end - outDur, outDur, easeIn);
    return Math.min(a, b);
  };

  // Färgblandning mellan två hexfärger, p = 0..1 (används för problem→lösning-toning)
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, p) => { const A = hex(a), B = hex(b), q = clamp(p, 0, 1); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], q))).join(',')})`; };
  const stagger = (t, start, i, step, dur, ease) => prog(t, start + i * step, dur, ease);

  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };
  const css = (e, obj) => { for (const k in obj) e.style[k] = obj[k]; return e; };

  // Standardentré: fade + slide upp (+ liten skala). p = 0..1
  const enter = (e, p, opts = {}) => {
    const dy = opts.dy ?? 28, s0 = opts.scale ?? 1, dx = opts.dx ?? 0;
    e.style.opacity = clamp(p, 0, 1);
    e.style.transform = `translate(${(1 - p) * dx}px, ${(1 - p) * dy}px) scale(${lerp(s0, 1, p)})`;
  };
  const hide = (e) => { e.style.opacity = 0; };

  // Splittar text i rader (\n) och ord, returnerar array av ord-spans
  const words = (container, text, cls = 'w') => {
    container.innerHTML = '';
    const out = [];
    text.split('\n').forEach((line, li) => {
      if (li) container.appendChild(el('br'));
      line.split(/\s+/).filter(Boolean).forEach((w, wi, arr) => {
        const s = el('span', cls, w);
        container.appendChild(s);
        if (wi < arr.length - 1) container.appendChild(document.createTextNode(' '));
        out.push(s);
      });
    });
    return out;
  };

  // Wordmark: LUP (accent) + NUMBER (heading), bokstav för bokstav
  const wordmark = (size, brand) => {
    const w = el('div', 'wordmark');
    w.style.fontSize = size + 'px';
    const a = el('span', 'wm-lup'), b = el('span', 'wm-number');
    [...brand.wordmark.accent].forEach((ch) => a.appendChild(el('i', null, ch)));
    [...brand.wordmark.heading].forEach((ch) => b.appendChild(el('i', null, ch)));
    w.appendChild(a); w.appendChild(b);
    w._letters = [...w.querySelectorAll('i')];
    return w;
  };
  // Bygger upp wordmark: start = när första bokstaven kommer, stagger per bokstav
  const animateWordmark = (w, t, start, stagger = 0.07, dur = 0.5) => {
    w._letters.forEach((L, i) => {
      const p = prog(t, start + i * stagger, dur, back);
      L.style.opacity = clamp(p * 1.5, 0, 1);
      L.style.transform = `translateY(${(1 - p) * 0.35}em) scale(${lerp(0.7, 1, p)})`;
    });
  };

  LUP.util = { clamp, lerp, easeOut, easeIn, easeInOut, back, prog, window: window_, mix, stagger, el, css, enter, hide, words, wordmark, animateWordmark };
})();

/* Ikonbibliotek – stroke-ikoner, 24x24, currentColor. Lägg till här, referera med namn i klipp-JSON. */
(function () {
  const LUP = (window.LUP = window.LUP || {});
  const wrap = (inner, extra = '') =>
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ${extra}>${inner}</svg>`;
  LUP.icons = {
    clock: wrap('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/>'),
    calendar: wrap('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="m9.5 15 1.8 1.8L15 13"/>'),
    phone: wrap('<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/><path d="m9.5 10.5 1.8 1.8L15 8.8"/>'),
    gate: wrap('<path d="M4 21V9"/><path d="M2.5 21h3"/><path d="M4 11h16"/><circle cx="4" cy="11" r="1.6" fill="currentColor"/><path d="M9 11v-1.5M14 11v-1.5M19 11v-1.5"/>'),
    truck: wrap('<path d="M2 6h11v10H2z"/><path d="M13 10h4l3 3v3h-7"/><circle cx="6" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/>'),
    check: wrap('<path d="m5 12.5 4.5 4.5L19 7.5"/>', 'stroke-width="2.6"'),
    users: wrap('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.8"/><path d="M15.5 14.5a5 5 0 0 1 6 5"/>'),
    globe: wrap('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'),
    chat: wrap('<path d="M4 5.5h16v10H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>'),
    map: wrap('<path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/>'),
    clipboard: wrap('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.5h6V4"/><path d="M8.5 10h7M8.5 14h4.5"/>'),
    eye: wrap('<path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.8"/>'),
    bell: wrap('<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>'),
    qr: wrap('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v1M17 20h4M20 17.5v.5"/>'),
    warning: wrap('<path d="M12 3.5 21 19.5H3z"/><path d="M12 10v4M12 17v.5"/>'),
    cloud: wrap('<path d="M7 18.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4.5 4.5 0 0 1 .4 9z"/>'),
    arrow: wrap('<path d="M5 12h14M13 6l6 6-6 6"/>', 'stroke-width="2.4"'),
    bolt: wrap('<path d="M13 2.5 4.5 13.5H11l-1 8 8.5-11H12z"/>'),
    search: wrap('<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/>'),
    handset: wrap('<path d="M5 3.5h3.5l1.8 4.5-2.3 1.6a11 11 0 0 0 6.4 6.4l1.6-2.3 4.5 1.8V19a2 2 0 0 1-2 2A15.5 15.5 0 0 1 3 5.5a2 2 0 0 1 2-2z"/>'),
    flag: wrap('<path d="M5 21V4"/><path d="M5 4h13l-3 4.5 3 4.5H5"/>'),
    pen: wrap('<path d="m4 20 4-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5 16z"/><path d="m13.5 7.5 3 3"/>'),
    list: wrap('<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1" fill="currentColor"/><circle cx="3.5" cy="12" r="1" fill="currentColor"/><circle cx="3.5" cy="18" r="1" fill="currentColor"/>'),
    shield: wrap('<path d="M12 2.5 4.5 5.5v5.5c0 4.8 3.2 8.4 7.5 10.5 4.3-2.1 7.5-5.7 7.5-10.5V5.5z"/><path d="m9 12 2 2 4-4"/>'),
  };
  LUP.icon = (name) => LUP.icons[name] || LUP.icons.check;
})();

/* Undertexts-cues ur voiceover + tidslinje. Körs både i Node (SRT) och i webbläsaren (inbrända undertexter). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else (root.LUP = root.LUP || {}).captions = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  function phases(brand) {
    const T = brand.timeline; const list = []; let t = 0;
    for (const k of Object.keys(T)) { list.push({ key: k, start: t, end: t + T[k] }); t += T[k]; }
    return { list, total: t, byKey: Object.fromEntries(list.map((p) => [p.key, p])) };
  }
  const words = (s) => (String(s).trim().match(/\S+/g) || []);
  // Dela text i cues: först per mening, sedan i jämna bitar om max maxWords ord.
  function splitCue(text, maxWords) {
    const sentences = String(text).replace(/\s+/g, ' ').trim().match(/[^.!?…]+[.!?…]*/g) || [text];
    const out = [];
    for (const s of sentences) {
      const w = words(s); if (!w.length) continue;
      const parts = Math.ceil(w.length / maxWords), per = Math.ceil(w.length / parts);
      for (let i = 0; i < w.length; i += per) out.push(w.slice(i, i + per).join(' '));
    }
    const merged = [];
    for (const c of out) {
      const prev = merged[merged.length - 1];
      if (prev && words(prev).length <= 2 && words(prev).length + words(c).length <= maxWords) merged[merged.length - 1] = prev + ' ' + c;
      else merged.push(c);
    }
    return merged;
  }
  // beats: [{ key, start, end, text }] → cues tidsatta inom varje beat, proportionellt mot ordantal
  function cuesFromBeats(beats, cfgIn) {
    const cfg = Object.assign({ maxWordsPerCue: 7, minCueSeconds: 0.9 }, cfgIn || {});
    const all = [];
    for (const b of beats) {
      if (!b.text) continue;
      const parts = splitCue(b.text, cfg.maxWordsPerCue);
      const total = parts.reduce((a, p) => a + words(p).length, 0);
      const w0 = b.start + 0.25, w1 = b.end - 0.15, span = w1 - w0;
      let t = w0;
      parts.forEach((p, i) => {
        let d = Math.max(cfg.minCueSeconds, (words(p).length / total) * span);
        if (i === parts.length - 1) d = w1 - t;
        all.push({ beat: b.key, start: +t.toFixed(3), end: +Math.min(w1, t + d).toFixed(3), text: p });
        t += d;
      });
    }
    return all;
  }
  function cues(brand, clip) {
    const { byKey } = phases(brand);
    const beats = ['hook', 'problem', 'solution', 'outro'].filter((k) => byKey[k] && clip.voiceover && clip.voiceover[k]).map((k) => ({ key: k, start: byKey[k].start, end: byKey[k].end, text: clip.voiceover[k] }));
    return cuesFromBeats(beats, brand.captions);
  }
  return { phases, splitCue, cues, cuesFromBeats, words };
});

(function () {

  const U = LUP.util;

  const tone = (p) => U.mix(C.muted, C.accent, p);

        <circle cx="24" cy="54" r="9" fill="#fff" stroke="currentColor" stroke-width="4"/>

/* LUPNUMBER shorts – LÅST MALL (hook först).
   Frame 0 = badge + hook. Sedan Problem → Lösning → Outro (wordmark byggs upp, fråga, handling).
   Problem och lösning delar EN hero-visual ("samma kamera") som tonar från grått till sky.
   Ett klipp byter bara text + ikon + scenvisual + CTA. Rör inte tider/layout här per klipp. */
(function () {
  const LUP = (window.LUP = window.LUP || {});
  const U = LUP.util;

  // Minska fontstorlek tills texten ryms (bredd och antal rader). Används för hook och rubriker.
  LUP.fitText = function (el, maxWidth, maxLines, minSize) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    const lh = parseFloat(getComputedStyle(el).lineHeight) / size;
    for (let i = 0; i < 24; i++) {
      el.style.fontSize = size + 'px';
      const lines = Math.round(el.offsetHeight / (size * lh));
      if ((el.scrollWidth <= maxWidth && lines <= maxLines) || size <= minSize) break;
      size -= 3;
    }
  };

  // Badge: liten wordmark + serienamn (används av klipp och film)
  LUP.badge = function (brand) {
    const badge = U.el('div', 'badge');
    const wm = U.wordmark(34, brand); wm._letters.forEach((l) => (l.style.opacity = 1));
    badge.append(wm, U.el('div', 'sep'), U.el('div', 'ep', brand.seriesName));
    return badge;
  };

  // Outro: wordmark byggs upp, accentlinje, tagline, CTA-fråga, handling, URL, bolag. Identisk layout varje gång.
  LUP.outro = function (layer, brand, cta) {
    const wrap = U.css(U.el('div'), { position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '22px' });
    const wm = U.wordmark(120, brand);
    const bar = U.css(U.el('div', 'wm-bar'), { width: '200px' });
    const tag = U.el('div', 'tagline', brand.tagline); tag.style.fontSize = '26px';
    const q = U.el('div', 'cta-question', (cta.question || '').replace(/\*(.+?)\*/g, '<em>$1</em>'));
    U.css(q, { marginTop: cta.question ? '44px' : '0', display: cta.question ? 'block' : 'none' });
    const pill = U.css(U.el('div', 'cta-pill', `<span>${cta.label}</span>${LUP.icon('arrow')}`), { marginTop: cta.question ? '10px' : '34px' });
    const url = U.el('div', 'url', cta.url);
    const co = U.css(U.el('div', 'company', brand.company), { marginTop: '30px' });
    wrap.append(wm, bar, tag, q, pill, url, co); layer.append(wrap);
    q.style.width = '900px'; LUP.fitText(q, 900, 2, 44);
    return (l) => {
      U.animateWordmark(wm, l, 0.05, 0.045, 0.5);
      const barP = U.prog(l, 0.55, 0.4, U.easeInOut); bar.style.transform = `scaleX(${barP})`; bar.style.opacity = barP > 0 ? 1 : 0;
      U.enter(tag, U.prog(l, 0.8, 0.4, U.easeOut), { dy: 12 });
      U.enter(q, U.prog(l, 1.15, 0.5, U.easeOut), { dy: 22 });
      U.enter(pill, U.prog(l, cta.question ? 1.75 : 1.2, 0.6, U.back), { dy: 0, scale: 0.7 });
      U.enter(url, U.prog(l, cta.question ? 2.1 : 1.5, 0.45, U.easeOut), { dy: 12 });
      U.enter(co, U.prog(l, 2.3, 0.5, U.easeOut), { dy: 10 });
    };
  };

  LUP.init = function (brand, clip, opts = {}) {
    const T = brand.timeline;
    const fps = brand.format.fps;
    const W = brand.format.width, H = brand.format.height;
    const starts = {}; let acc = 0;
    for (const k of Object.keys(T)) { starts[k] = acc; acc += T[k]; }
    const total = acc;
    const IN = 0.4, OUT = 0.3, LAP = 0.2;
    const HERO = { left: 72, top: 320, width: 936, height: 400 };
    const cta = Object.assign({}, brand.cta, clip.cta || {});

    const stage = document.querySelector('.stage');
    stage.innerHTML = '';
    stage.style.width = W + 'px'; stage.style.height = H + 'px';
    const blobs = ['blob-1', 'blob-2', 'blob-3'].map((c) => stage.appendChild(U.el('div', 'blob ' + c)));
    const layer = (name) => { const p = U.el('div', 'phase phase-' + name); stage.appendChild(p); return p; };
    const P = { hook: layer('hook'), problem: layer('problem'), solution: layer('solution'), outro: layer('outro') };

    const badge = LUP.badge(brand); stage.appendChild(badge);

    // ---- HOOK (synlig från frame 0) ----
    const hookWrap = U.css(U.el('div'), { position: 'absolute', left: '72px', right: '72px', top: 0, bottom: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' });
    const hookIcon = U.css(U.el('div', 'icon-circle', LUP.icon(clip.icon)), { width: '180px', height: '180px', marginBottom: '56px' });
    const hookText = U.el('div', 'hook-text');
    const hookWords = U.words(hookText, clip.hook.text);
    const hookSub = U.el('div', 'hook-sub', clip.hook.sub || '');
    hookWrap.append(hookIcon, hookText, hookSub); P.hook.appendChild(hookWrap);
    hookText.style.width = '936px'; LUP.fitText(hookText, 936, 2, 64);

    // ---- HERO (problem + lösning) ----
    const scene = (clip.scene && LUP.scenes && LUP.scenes[clip.scene]) || null;
    const hero = U.css(U.el('div', 'hero'), { top: HERO.top + 'px', left: HERO.left + 'px', width: HERO.width + 'px', height: HERO.height + 'px', right: 'auto', opacity: 0, visibility: 'hidden' });
    stage.appendChild(hero);
    const heroSeek = scene ? scene.mount(hero, clip, brand) : null;
    if (!heroSeek) hero.remove();
    const hasHero = !!heroSeek;

    // ---- PROBLEM ----
    const probTitle = U.css(U.el('div', 'h1'), { position: 'absolute', left: '72px', width: '936px', top: '170px' });
    U.words(probTitle, clip.problem.title, 'w'); LUP.fitText(probTitle, 936, 2, 40);
    const probTitleWords = [...probTitle.querySelectorAll('.w')];
    const probChips = U.css(U.el('div'), { position: 'absolute', left: '72px', right: '72px', top: hasHero ? '850px' : '480px', display: 'flex', flexDirection: 'column', gap: '22px', alignItems: 'flex-start' });
    const chipEls = (clip.problem.pains || []).map((txt) => {
      const c = U.el('div', 'chip');
      c.appendChild(U.el('span', 'dot', LUP.icon('warning')));
      c.appendChild(U.el('span', null, txt));
      probChips.appendChild(c); return c;
    });
    P.problem.append(probTitle, probChips);

    // ---- LÖSNING ----
    const solTitle = U.css(U.el('div', 'h1'), { position: 'absolute', left: '72px', width: '936px', top: '170px' });
    U.words(solTitle, clip.solution.title, 'w'); LUP.fitText(solTitle, 936, 2, 40);
    const solTitleWords = [...solTitle.querySelectorAll('.w')];
    const flowTop = hasHero ? 800 : 520;
    const flow = U.css(U.el('div', 'flow'), { position: 'absolute', left: '72px', right: '72px', top: flowTop + 'px' });
    const flowGhost = U.el('div', 'flow-line ghost');
    const flowLine = U.el('div', 'flow-line');
    flow.append(flowGhost, flowLine);
    const stepEls = clip.solution.steps.map((s, i) => {
      const st = U.el('div', 'card step');
      st.appendChild(U.el('div', 'num', String(i + 1)));
      st.appendChild(U.el('div', 'ico', LUP.icon(s.icon)));
      st.appendChild(U.el('div', 'label', s.label));
      st.appendChild(U.el('div', 'sub', s.sub || ''));
      flow.appendChild(st); return st;
    });
    const kicker = U.css(U.el('div', 'kicker'), { position: 'absolute', left: '72px', right: '72px', top: flowTop + 316 + 'px', textAlign: 'center' });
    kicker.innerHTML = (clip.solution.kicker || '').replace(/\*(.+?)\*/g, '<em>$1</em>');
    P.solution.append(solTitle, flow, kicker);

    // ---- OUTRO ----
    const outroSeek = LUP.outro(P.outro, brand, cta);

    // ---- Undertexter (standard på) ----
    let cueList = null, cueBox = null, cueEl = null;
    if (opts.captions !== false && LUP.captions) {
      cueList = LUP.captions.cues(brand, clip);
      cueBox = U.el('div', 'captions'); cueEl = U.el('div', 'cue', '');
      cueBox.appendChild(cueEl); stage.appendChild(cueBox);
    }

    const setPhase = (ph, name, t) => {
      const s = Math.max(0, starts[name] - LAP), e = starts[name] + T[name];
      const v = name === 'hook' ? 1 - U.prog(t, e - OUT, OUT, U.easeIn) : U.window(t, s, e, IN, name === 'outro' ? 0.001 : OUT);
      const vis = t >= s && t < e + 0.001;
      ph.style.visibility = vis ? 'visible' : 'hidden';
      ph.style.opacity = vis ? v : 0;
      ph.style.transform = name === 'hook' ? 'none' : `translateY(${(1 - U.prog(t, s, IN, U.easeOut)) * 30}px)`;
      return vis ? t - starts[name] : null;
    };

    function seek(frame) {
      LUP._lastFrame = frame;
      const t = frame / fps;
      blobs[0].style.transform = `translate(${Math.sin(t * 0.25) * 30}px, ${Math.cos(t * 0.2) * 24}px)`;
      blobs[1].style.transform = `translate(${Math.cos(t * 0.22) * -28}px, ${Math.sin(t * 0.18) * -20}px)`;
      blobs[2].style.transform = `translate(${Math.sin(t * 0.3) * 18}px, ${Math.cos(t * 0.26) * 16}px)`;
      badge.style.opacity = 1 - U.prog(t, starts.outro - 0.3, 0.3);

      // HOOK: allt synligt från frame 0, med en liten "landning"
      let l = setPhase(P.hook, 'hook', t);
      if (l !== null) {
        const settle = U.prog(l, 0, 0.6, U.easeOut);
        hookIcon.style.transform = `scale(${U.lerp(0.86, 1, U.back(settle))})`; hookIcon.style.opacity = 1;
        hookWords.forEach((w, i) => { const p = U.prog(l, i * 0.04, 0.45, U.easeOut); w.style.opacity = 1; w.style.transform = `translateY(${(1 - p) * 10}px)`; });
        U.enter(hookSub, U.prog(l, 0.35, 0.45, U.easeOut), { dy: 14 });
      }

      // HERO
      if (hasHero) {
        const hs = starts.problem - LAP, he = starts.solution + T.solution;
        const vis = t >= hs && t < he;
        hero.style.visibility = vis ? 'visible' : 'hidden';
        hero.style.opacity = U.window(t, hs, he, IN, OUT);
        hero.style.transform = `translateY(${(1 - U.prog(t, hs, IN, U.easeOut)) * 30}px)`;
        if (vis) {
          const inSol = t >= starts.solution;
          heroSeek({ t: t - starts.problem, phase: inSol ? 'solution' : 'problem', l: inSol ? t - starts.solution : t - starts.problem, p: U.prog(t, starts.solution - 0.1, 0.9, U.easeInOut), P: T.problem, S: T.solution });
        }
      }

      // PROBLEM
      l = setPhase(P.problem, 'problem', t);
      if (l !== null) {
        probTitleWords.forEach((w, i) => U.enter(w, U.prog(l, 0.1 + i * 0.06, 0.45, U.easeOut), { dy: 24 }));
        const chipStart = hasHero ? 1.5 : 0.8;
        chipEls.forEach((c, i) => U.enter(c, U.prog(l, chipStart + i * 0.35, 0.5, U.back), { dy: 0, dx: -40, scale: 0.9 }));
      }

      // LÖSNING
      l = setPhase(P.solution, 'solution', t);
      if (l !== null) {
        solTitleWords.forEach((w, i) => U.enter(w, U.prog(l, 0.1 + i * 0.06, 0.45, U.easeOut), { dy: 24 }));
        const f0 = hasHero ? 1.2 : 0.6;
        flowGhost.style.opacity = U.prog(l, f0, 0.3);
        flowLine.style.transform = `scaleX(${U.prog(l, f0 + 0.2, 1.2, U.easeInOut)})`;
        stepEls.forEach((s, i) => U.enter(s, U.prog(l, f0 + 0.25 + i * 0.45, 0.6, U.back), { dy: 36, scale: 0.92 }));
        U.enter(kicker, U.prog(l, f0 + 1.9, 0.6, U.easeOut), { dy: 22 });
      }

      // OUTRO
      l = setPhase(P.outro, 'outro', t);
      if (l !== null) outroSeek(l);

      // UNDERTEXTER
      if (cueList) {
        const c = cueList.find((q) => t >= q.start && t < q.end);
        if (c) { if (cueEl.textContent !== c.text) cueEl.textContent = c.text; cueBox.style.opacity = Math.min(U.prog(t, c.start, 0.15), 1 - U.prog(t, c.end - 0.15, 0.15)); }
        else cueBox.style.opacity = 0;
      }
    }

    LUP.timeline = { starts, durations: T, total, fps, frames: Math.round(total * fps) };
    window.__seek = seek;
    window.__setRenderMode = () => document.body.classList.add('render');
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { [hookText, probTitle, solTitle].forEach((e) => { e.style.fontSize = ''; }); LUP.fitText(hookText, 936, 2, 64); LUP.fitText(probTitle, 936, 2, 40); LUP.fitText(solTitle, 936, 2, 40); if (LUP._lastFrame != null) seek(LUP._lastFrame); });
    seek(0);
    return LUP.timeline;
  };
})();
</script>
<script>/* Scen: Köer och väntetid vid grinden → slotbokning/incheckning.
   Samma kamera: väg + bom. Problem = grå kö, tickande klocka, papper. Lösning = bommen upp, incheckade bilar rullar. */
(function () {
  const LUP = (window.LUP = window.LUP || {});
  const U = LUP.util, Y = LUP.yard;
  LUP.scenes = LUP.scenes || {};

  LUP.scenes['grind-ko'] = {
    mount(root) {
      const svg = Y.svg(root);
      Y.road(svg, { y: 300 });
      const gate = Y.gate(svg, { x: 640, y: 176 });
      const clock = Y.clock(svg, { x: 560, y: 70 });
      const paper = Y.icon(svg, { name: 'clipboard', x: 700, y: 110, size: 56 });
      const phone = Y.icon(svg, { name: 'phone', x: 560, y: 70, size: 76, color: Y.C.accent });
      const status = Y.pill(svg, { x: 300, y: 18, text: 'Väntar…', icon: 'clock' });
      const stops = [490, 350, 210, 70];
      const trucks = stops.map(() => Y.truck(svg));
      const slots = stops.map((_, i) => { const m = 40 + i * 10; return Y.pill(svg, { x: 0, y: 0, text: `0${8 + Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`, icon: 'check', fontSize: 23, h: 46 }); });
      return (s) => {
        const { t, p } = s;
        gate.tone(p).open(p);
        clock.set({ opacity: 1 - p, scale: 1 - p * 0.3 }).time(Math.max(0, t - 1));
        clock.pop(t, 0.7);
        if (p > 0) clock.set({ opacity: Math.min(clock.s.opacity, 1 - p) });
        paper.pop(t, 1.1); paper.set({ rotate: Math.sin(t * 4) * 5, opacity: Math.min(paper.s.opacity, 1 - p) });
        phone.set({ opacity: p, scale: U.lerp(0.5, 1, U.back(p)) });
        status.fadeIn(t, 1.5);
        status.swap(p, { text: 'Väntar…', icon: 'clock' }, { text: 'Incheckad', icon: 'check' }).toneStyle(p);
        trucks.forEach((tr, i) => {
          // Problem: kör in från vänster och stannar i kö. Lösning: rullar iväg en i taget, med jämna mellanrum.
          const arrive = U.prog(t, 0.2 + i * 0.3, 1.0, U.easeOut);
          let x = U.lerp(-220 - i * 40, stops[i], arrive);
          const go = Math.max(0, t - (s.P + 0.35 + i * 0.42));
          x += go * 210;
          const span = 936 + 520; x = ((x + 260) % span + span) % span - 260;
          const bob = arrive >= 1 && go === 0 ? Math.sin((t + i) * 9) * 1.2 : 0;
          const edge = Math.min(U.clamp((x + 150) / 120, 0, 1), U.clamp((936 - 10 - x) / 120, 0, 1));
          tr.tone(p).set({ x, y: 237 + bob, opacity: edge });
          slots[i].set({ x: x - 6, y: 170, opacity: edge * U.clamp((go - 0.05) * 3, 0, 1) * p }).toneStyle(1);
        });
      };
    },
  };
})();
</script>
